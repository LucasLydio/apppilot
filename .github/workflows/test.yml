name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck bats jq
      - name: ShellCheck
        run: |
          find bin src -name '*.sh' -print0 | xargs -0 shellcheck
          shellcheck install.sh uninstall.sh tests/test_helper.bash
      - name: Bats unit tests
        run: bats tests/unit/cli.bats tests/unit/registry.bats
      - name: CLI smoke tests
        run: |
          set -Eeuo pipefail
          json_smoke() {
            local label="$1"
            shift
            local output
            output="$(mktemp)"
            echo "::group::$label"
            "$@" >"$output"
            cat "$output"
            jq -e . "$output" >/dev/null
            echo "::endgroup::"
          }

          bash bin/apppilot --help
          bash bin/apppilot --version
          tmp="$(mktemp -d)"
          export APPPILOT_CONFIG_HOME="$tmp/config"
          export APPPILOT_STATE_HOME="$tmp/state"
          bash bin/apppilot init --non-interactive
          json_smoke "apppilot overview --json" bash bin/apppilot overview --json
          json_smoke "apppilot list --json" bash bin/apppilot list --json
          json_smoke "apppilot validate --json" bash bin/apppilot validate --json
          json_smoke "apppilot doctor --json" bash bin/apppilot doctor --json
          json_smoke "apppilot security audit --json" bash bin/apppilot security audit --json
          json_smoke "apppilot adapters list --json" bash bin/apppilot adapters list --json
          json_smoke "apppilot clone --dry-run --json" bash bin/apppilot clone https://github.com/example/smoke-api.git smoke-api --dry-run --json
          json_smoke "apppilot adapters install pm2 --dry-run --json" bash bin/apppilot adapters install pm2 --dry-run --json
          printf 'PORT=3000\n' > tests/fixtures/pm2-app/.env.example
          bash bin/apppilot add --name smoke-api --manager pm2 --path "$PWD/tests/fixtures/pm2-app" --entrypoint server.js --no-env-from-example --non-interactive
          json_smoke "apppilot env init smoke-api --dry-run --json" bash bin/apppilot env init smoke-api --dry-run --json
          json_smoke "apppilot deploy smoke-api --dry-run --json" bash bin/apppilot deploy smoke-api --dry-run --json --allow-dirty
          rm -f tests/fixtures/pm2-app/.env.example
